<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Users Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="app.js" defer></script>
  </head>

  <body class="min-h-screen bg-[#09090b] text-white">
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div
        class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-purple-600/20 blur-3xl"
      ></div>
      <div
        class="absolute -right-32 top-1/3 h-96 w-96 rounded-full bg-blue-600/10 blur-3xl"
      ></div>
    </div>

    <main class="relative mx-auto max-w-7xl px-6 py-10 lg:px-8">
      <!--Header-->

      <header
        class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between"
      >
        <div>
          <div class="mb-3 flex items-center gap-2">
            <span
              class="h-2 w-2 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/50"
            ></span>

            <span
              class="text-xs font-medium uppercase tracking-[0.2em] text-zinc-500"
            >
              GitHub Explorer
            </span>
          </div>

          <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">
            GitHub Users
          </h1>

          <p class="mt-3 max-w-xl text-sm leading-6 text-zinc-400">
            Explore GitHub users and their information
          </p>
        </div>

        <!-- User count -->

        <div
          class="rounded-2xl border border-white/10 bg-white/[0.03] px-5 py-4 backdrop-blur-xl"
        >
          <p class="text-xs uppercase tracking-wider text-zinc-500">
            Total users
          </p>

          <p id="users-count" class="mt-1 text-2xl font-semibold">0 users</p>
        </div>
      </header>

      <!--Filter-->

      <section class="mt-10">
        <div
          class="rounded-3xl border border-white/10 bg-white/[0.04] p-5 shadow-2xl shadow-black/20 backdrop-blur-xl"
        >
          <div
            class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between"
          >
            <div>
              <p class="text-sm font-semibold text-white">Filter users</p>

              <p class="mt-1 text-sm text-zinc-500">
                Find users by minimum username length.
              </p>
            </div>

            <div class="flex w-full flex-col gap-3 sm:flex-row lg:w-auto">
              <!-- Input -->

              <div class="relative">
                <span
                  class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500"
                >
                  #
                </span>

                <input
                  id="input"
                  type="number"
                  min="0"
                  placeholder="Minimum length"
                  class="w-full rounded-xl border border-white/10 bg-black/30 py-3 pl-9 pr-4 text-sm text-white outline-none transition placeholder:text-zinc-600 focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/10 sm:w-52"
                />
              </div>

              <!-- Apply -->

              <button
                id="btn"
                class="group flex items-center justify-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-semibold text-black transition hover:bg-zinc-200 active:scale-[0.98]"
              >
                Apply filter

                <span class="transition-transform group-hover:translate-x-0.5">
                  →
                </span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!--Loading-->

      <div id="loading"></div>

      <!--Users-->

      <div
        id="users-container"
        class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
      ></div>

      <!--Pagination-->

      <div class="mt-10 flex items-center justify-center">
        <div
          class="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/[0.03] p-1.5"
        >
          <button
            id="prev-btn"
            class="rounded-xl px-4 py-2 text-sm font-medium text-zinc-400 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-30"
          >
            Prev
          </button>

          <span
            id="page-number"
            class="flex h-9 min-w-9 items-center justify-center rounded-xl bg-white text-sm font-bold text-black"
          >
            1
          </span>

          <button
            id="next-btn"
            class="rounded-xl px-4 py-2 text-sm font-medium text-zinc-400 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-30"
          >
            Next
          </button>
        </div>
      </div>

      <!--Details Page-->

      <section id="details-page" class="hidden">
        <!-- Back button -->
        <div class="mb-8">
          <button
            id="back-btn"
            class="group inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2.5 text-sm font-medium text-zinc-300 transition hover:bg-white/10 hover:text-white"
          >
            <span class="transition-transform group-hover:-translate-x-1">
              ←
            </span>

            Back to users
          </button>
        </div>

        <!-- Profile Header -->
        <div
          class="overflow-hidden rounded-3xl border border-white/10 bg-white/[0.04] backdrop-blur-xl"
        >
          <!-- Accent strip -->
          <div
            class="h-24 bg-gradient-to-r from-purple-600/30 via-blue-500/20 to-transparent"
          ></div>

          <div class="px-6 pb-7 sm:px-8">
            <div class="-mt-10 flex flex-col gap-5 sm:flex-row sm:items-end">
              <!-- Avatar -->
              <div
                class="h-20 w-20 overflow-hidden rounded-2xl border-4 border-[#09090b] bg-zinc-900"
              >
                <img
                  id="details-avatar"
                  src=""
                  alt=""
                  class="h-full w-full object-cover"
                />
              </div>

              <!-- Username -->
              <div class="flex-1">
                <p
                  class="text-xs font-medium uppercase tracking-[0.2em] text-purple-400"
                >
                  GitHub Profile
                </p>

                <h2
                  id="details-username"
                  class="mt-1 text-3xl font-bold tracking-tight text-white"
                ></h2>

                <p class="mt-1 text-sm text-zinc-500">
                  <span id="details-id"></span>
                </p>
              </div>
            </div>

            <!-- Loading -->
            <div id="details-loading" class="mt-6 text-sm text-zinc-500"></div>

            <!-- Error -->
            <div id="details-error" class="mt-4 text-sm text-red-400"></div>
          </div>
        </div>

        <!-- Quick Stats -->
        <div class="mt-6 grid gap-4 sm:grid-cols-2">
          <div class="rounded-2xl border border-white/10 bg-white/[0.04] p-5">
            <p class="text-xs uppercase tracking-wider text-zinc-500">
              Followers
            </p>

            <p id="followers-count" class="mt-2 text-2xl font-bold text-white">
              —
            </p>
          </div>

          <div class="rounded-2xl border border-white/10 bg-white/[0.04] p-5">
            <p class="text-xs uppercase tracking-wider text-zinc-500">
              Repositories
            </p>

            <p id="repos-count" class="mt-2 text-2xl font-bold text-white">—</p>
          </div>
        </div>

        <!-- Followers + Repositories -->
        <div class="mt-6 grid gap-6 lg:grid-cols-2">
          <!-- Followers -->
          <div
            class="rounded-3xl border border-white/10 bg-white/[0.04] p-6 backdrop-blur-xl"
          >
            <div class="mb-5 flex items-center justify-between">
              <div>
                <p class="text-xs uppercase tracking-wider text-zinc-500">
                  Community
                </p>

                <h3 class="mt-1 text-xl font-semibold text-white">Followers</h3>
              </div>

              <span
                class="rounded-lg bg-white/5 px-2.5 py-1 text-xs text-zinc-500"
              >
                Top 5
              </span>
            </div>

            <div id="followers-container" class="space-y-3"></div>
          </div>

          <!-- Repositories -->
          <div
            class="rounded-3xl border border-white/10 bg-white/[0.04] p-6 backdrop-blur-xl"
          >
            <div class="mb-5 flex items-center justify-between">
              <div>
                <p class="text-xs uppercase tracking-wider text-zinc-500">
                  Projects
                </p>

                <h3 class="mt-1 text-xl font-semibold text-white">
                  Repositories
                </h3>
              </div>

              <span
                class="rounded-lg bg-white/5 px-2.5 py-1 text-xs text-zinc-500"
              >
                Top 5
              </span>
            </div>

            <div id="repos-container" class="space-y-3"></div>
          </div>
        </div>
      </section>
      <footer class="mt-16 border-t border-white/10 pt-6 text-center">
        <p class="text-xs text-zinc-600">GitHub Dashboard</p>
      </footer>
    </main>
  </body>
</html>
