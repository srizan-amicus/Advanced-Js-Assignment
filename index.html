<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Users Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="app.js" defer></script>
  </head>
  <body class="min-h-screen bg-[#09090b] text-white">
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-purple-600/20 blur-3xl"></div>
      <div class="absolute -right-32 top-1/3 h-96 w-96 rounded-full bg-blue-600/10 blur-3xl"></div>
    </div>

    <main class="relative mx-auto max-w-7xl px-6 py-10 lg:px-8">
      <header class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
        <div>
          <div class="mb-3 flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/50"></span>
            <span class="text-xs font-medium uppercase tracking-[0.2em] text-zinc-500">GitHub Explorer</span>
          </div>
          <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">GitHub Users</h1>
          <p class="mt-3 max-w-xl text-sm leading-6 text-zinc-400">Explore GitHub users and their information</p>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/[0.03] px-5 py-4 backdrop-blur-xl">
          <p class="text-xs uppercase tracking-wider text-zinc-500">Total users</p>
          <p id="users-count" class="mt-1 text-2xl font-semibold">0 users</p>
        </div>
      </header>

      <section class="mt-10">
        <div class="rounded-3xl border border-white/10 bg-white/[0.04] p-5 shadow-2xl shadow-black/20 backdrop-blur-xl">
          <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
            <div>
              <p class="text-sm font-semibold text-white">Filter users</p>
              <p class="mt-1 text-sm text-zinc-500">Find users by minimum username length.</p>
            </div>
            <div class="flex w-full flex-col gap-3 sm:flex-row lg:w-auto">
              <div class="relative">
                <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500">#</span>
                <input id="input" type="number" min="1" value="4" placeholder="Minimum length" class="w-full rounded-xl border border-white/10 bg-black/30 py-3 pl-9 pr-4 text-sm text-white outline-none transition placeholder:text-zinc-600 focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/10 sm:w-52" />
                <p id="filter-error" class="mt-2 text-xs text-red-400" role="alert"></p>
              </div>
              <button id="btn" class="group flex items-center justify-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-semibold text-black transition hover:bg-zinc-200 active:scale-[0.98]">
                Apply filter
                <span class="transition-transform group-hover:translate-x-0.5">→</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div id="loading"></div>
      <div id="users-container" class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

      <div class="mt-10 flex items-center justify-center">
        <div class="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/[0.03] p-1.5">
          <button id="prev-btn" class="rounded-xl px-4 py-2 text-sm font-medium text-zinc-400 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-30">Prev</button>
          <span id="page-number" class="flex h-9 min-w-9 items-center justify-center rounded-xl bg-white text-sm font-bold text-black">1</span>
          <button id="next-btn" class="rounded-xl px-4 py-2 text-sm font-medium text-zinc-400 transition hover:bg-white/10 hover:text-white disabled:cursor-not-allowed disabled:opacity-30">Next</button>
        </div>
      </div>

      <footer class="mt-16 border-t border-white/10 pt-6 text-center">
        <p class="text-xs text-zinc-600">GitHub Dashboard</p>
      </footer>
    </main>
  </body>
</html>
