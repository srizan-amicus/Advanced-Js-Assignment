<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="profile.js" defer></script>
  </head>
  <body class="min-h-screen bg-[#09090b] text-white">
    <main class="mx-auto max-w-7xl px-6 py-10 lg:px-8">
      <a href="index.html" class="group inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2.5 text-sm font-medium text-zinc-300 transition hover:bg-white/10 hover:text-white">
        <span class="transition-transform group-hover:-translate-x-1">←</span> Back to users
      </a>

      <div id="profile-error" class="mt-8 hidden rounded-3xl border border-red-500/20 bg-red-500/5 p-8 text-center">
        <p class="text-lg font-semibold text-red-400">Could not load user details</p>
        <p class="mt-2 text-sm text-zinc-500">Something went wrong while fetching this GitHub profile.</p>
      </div>

      <div id="profile-skeleton" class="animate-pulse">
        <div class="mt-8 overflow-hidden rounded-3xl border border-white/10 bg-white/[0.04] backdrop-blur-xl">
          <div class="h-24 bg-gradient-to-r from-purple-600/30 via-blue-500/20 to-transparent"></div>
          <div class="px-6 pb-7 sm:px-8"><div class="-mt-10 flex flex-col gap-5 sm:flex-row sm:items-end"><div class="h-20 w-20 rounded-2xl border-4 border-[#09090b] bg-white/10"></div><div class="flex-1"><div class="h-3 w-28 rounded bg-white/10"></div><div class="mt-3 h-9 w-48 rounded bg-white/10"></div><div class="mt-2 h-4 w-24 rounded bg-white/10"></div></div></div></div>
        </div>
        <div class="mt-6 grid gap-6 lg:grid-cols-2">
          <section class="rounded-3xl border border-white/10 bg-white/[0.04] p-6"><div class="h-7 w-32 rounded bg-white/10"></div><div class="mt-5 space-y-3"><div class="flex items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] p-3"><div class="h-10 w-10 rounded-xl bg-white/10"></div><div class="h-4 w-28 rounded bg-white/10"></div></div><div class="flex items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] p-3"><div class="h-10 w-10 rounded-xl bg-white/10"></div><div class="h-4 w-28 rounded bg-white/10"></div></div><div class="flex items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] p-3"><div class="h-10 w-10 rounded-xl bg-white/10"></div><div class="h-4 w-28 rounded bg-white/10"></div></div><div class="flex items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] p-3"><div class="h-10 w-10 rounded-xl bg-white/10"></div><div class="h-4 w-28 rounded bg-white/10"></div></div><div class="flex items-center gap-3 rounded-2xl border border-white/5 bg-white/[0.03] p-3"><div class="h-10 w-10 rounded-xl bg-white/10"></div><div class="h-4 w-28 rounded bg-white/10"></div></div></div></section>
          <section class="rounded-3xl border border-white/10 bg-white/[0.04] p-6"><div class="h-7 w-40 rounded bg-white/10"></div><div class="mt-5 space-y-3"><div class="rounded-2xl border border-white/5 bg-white/[0.03] p-4"><div class="h-4 w-36 rounded bg-white/10"></div><div class="mt-3 h-3 w-full rounded bg-white/10"></div><div class="mt-2 h-3 w-2/3 rounded bg-white/10"></div></div><div class="rounded-2xl border border-white/5 bg-white/[0.03] p-4"><div class="h-4 w-36 rounded bg-white/10"></div><div class="mt-3 h-3 w-full rounded bg-white/10"></div><div class="mt-2 h-3 w-2/3 rounded bg-white/10"></div></div><div class="rounded-2xl border border-white/5 bg-white/[0.03] p-4"><div class="h-4 w-36 rounded bg-white/10"></div><div class="mt-3 h-3 w-full rounded bg-white/10"></div><div class="mt-2 h-3 w-2/3 rounded bg-white/10"></div></div><div class="rounded-2xl border border-white/5 bg-white/[0.03] p-4"><div class="h-4 w-36 rounded bg-white/10"></div><div class="mt-3 h-3 w-full rounded bg-white/10"></div><div class="mt-2 h-3 w-2/3 rounded bg-white/10"></div></div><div class="rounded-2xl border border-white/5 bg-white/[0.03] p-4"><div class="h-4 w-36 rounded bg-white/10"></div><div class="mt-3 h-3 w-full rounded bg-white/10"></div><div class="mt-2 h-3 w-2/3 rounded bg-white/10"></div></div></div></section>
        </div>
      </div>

      <div id="profile-content" class="hidden">
        <section class="mt-8 overflow-hidden rounded-3xl border border-white/10 bg-white/[0.04] backdrop-blur-xl">
          <div class="h-24 bg-gradient-to-r from-purple-600/30 via-blue-500/20 to-transparent"></div>
          <div class="px-6 pb-7 sm:px-8"><div class="-mt-10 flex flex-col gap-5 sm:flex-row sm:items-end"><div class="h-20 w-20 overflow-hidden rounded-2xl border-4 border-[#09090b] bg-zinc-900"><img id="profile-avatar" class="h-full w-full object-cover" alt="" /></div><div class="flex-1"><p class="text-xs font-medium uppercase tracking-[0.2em] text-purple-400">GitHub Profile</p><h1 id="profile-username" class="mt-1 text-3xl font-bold tracking-tight text-white"></h1><p id="profile-id" class="mt-1 text-sm text-zinc-500"></p></div></div></div>
        </section>
        <div class="mt-6 grid gap-4 sm:grid-cols-2"><div class="rounded-2xl border border-white/10 bg-white/[0.04] p-5"><p class="text-xs uppercase tracking-wider text-zinc-500">Followers</p><p id="followers-count" class="mt-2 text-2xl font-bold">0</p></div><div class="rounded-2xl border border-white/10 bg-white/[0.04] p-5"><p class="text-xs uppercase tracking-wider text-zinc-500">Repositories</p><p id="repos-count" class="mt-2 text-2xl font-bold">0</p></div></div>
        <div class="mt-6 grid gap-6 lg:grid-cols-2"><section class="rounded-3xl border border-white/10 bg-white/[0.04] p-6"><h2 class="text-xl font-semibold">Followers</h2><div id="followers-container" class="mt-5 space-y-3"></div></section><section class="rounded-3xl border border-white/10 bg-white/[0.04] p-6"><h2 class="text-xl font-semibold">Repositories</h2><div id="repos-container" class="mt-5 space-y-3"></div></section></div>
      </div>
    </main>
  </body>
</html>
