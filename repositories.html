<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Repository Search | GitHub Explorer</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-black text-white">
    <main class="mx-auto max-w-7xl px-6 py-10">

      <!-- HEADER -->
      <header class="mb-10">
        <p class="text-sm font-semibold uppercase tracking-wider text-purple-400">
          GitHub Explorer
        </p>

        <h1 class="mt-2 text-4xl font-bold tracking-tight">
          Repository Search
        </h1>

        <p class="mt-3 max-w-2xl text-zinc-500">
          Search GitHub repositories by name, description, or topic.
        </p>
      </header>

      <!-- SEARCH -->
      <section class="mb-8">
        <form id="search-form">
          <div class="flex flex-col gap-3 sm:flex-row">

            <input
              id="repository-search"
              type="search"
              placeholder="Search repositories..."
              autocomplete="off"
              class="w-full rounded-xl border border-white/10 bg-white/[0.04] px-4 py-3 text-sm text-white outline-none placeholder:text-zinc-600 focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/10"
            />

            <button
              type="submit"
              class="rounded-xl bg-purple-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-purple-500"
            >
              Search
            </button>

          </div>

          <!-- VALIDATION ERROR -->
          <p
            id="search-error"
            class="mt-2 hidden text-sm text-red-400"
          ></p>
        </form>
      </section>

      <!-- STATUS -->
      <div
        id="status"
        class="mb-6 text-sm text-zinc-500"
      ></div>

      <!-- REPOSITORY LIST -->
      <section
        id="repositories-container"
        class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
      ></section>

      <!-- PAGINATION -->
      <div
        id="pagination"
        class="mt-10 flex items-center justify-center gap-4"
      >
        <button
          id="prev-btn"
          type="button"
          disabled
          class="rounded-xl border border-white/10 bg-white/[0.04] px-5 py-3 text-sm font-medium text-zinc-300 transition hover:bg-white/[0.08] disabled:cursor-not-allowed disabled:opacity-40"
        >
          Previous
        </button>

        <span
          id="page-number"
          class="text-sm text-zinc-500"
        >
          Page 1
        </span>

        <button
          id="next-btn"
          type="button"
          disabled
          class="rounded-xl border border-white/10 bg-white/[0.04] px-5 py-3 text-sm font-medium text-zinc-300 transition hover:bg-white/[0.08] disabled:cursor-not-allowed disabled:opacity-40"
        >
          Next
        </button>
      </div>

    </main>

    <script
      type="module"
      src="./dist/repositories.js"
    ></script>
  </body>
</html>
